name: Backend tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend test image
        run: docker build -f backend/Dockerfile.test -t turmemeal-backend-test backend

      - name: Run backend tests
        run: docker run --rm turmemeal-backend-test

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Run PostgreSQL integration tests
        run: docker compose --profile test run --rm test pytest -m integration

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend
