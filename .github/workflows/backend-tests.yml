name: Backend tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend test image
        run: docker build -f backend/Dockerfile.test -t turmemeal-backend-test backend

      - name: Run backend tests
        run: docker run --rm turmemeal-backend-test
