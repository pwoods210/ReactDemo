services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      APP_NAME: Meme Trade API
      APP_VERSION: 0.1.0
      FRONTEND_ORIGIN: http://localhost:5173
      
volumes:
  frontend_node_modules: